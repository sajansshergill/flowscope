[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["ingestion", "warehouse", "quality", "app", "tests", "orchestration"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "warehouse", "quality", "app"]

[tool.ruff.lint.per-file-ignores]
"orchestration/dags/flowscope_daily.py" = ["E402"]
