name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check ingestion warehouse quality app tests orchestration

      - name: Unit tests
        run: pytest tests/ -q

      - name: dbt compile
        run: |
          mkdir -p data
          cd dbt && dbt compile --profiles-dir .

      - name: Great Expectations dry-run
        run: python -m quality.run_expectations --dry-run
